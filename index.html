        {
          "@type": "Question",
          "name": "What is The Wheelhaus?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Wheelhaus is the premier Steam Roulette web app. It is the same random Steam game wheel popularized by the Funhaus channel and used today on BroughtYouThisThing. It spins a wheel of randomly selected Steam games and reveals a winner to play, with filters by category, genre, tag, price, and your personal Steam library, and uses IGDB ratings to curate higher-quality picks. The Wheelhaus is also reachable at steamroulette.xyz and steamroulette.games."
          }
        },
        {
          "@type": "Question",
          "name": "What is Steam Roulette?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Steam Roulette is a format where a random Steam game is selected (usually by spinning a wheel) and the player commits to playing whatever the wheel lands on. It was popularized by the Funhaus YouTube channel, which turned it into a recurring show format. The Wheelhaus is the specific web app that powers Steam Roulette segments; it is currently used by BroughtYouThisThing and remains the premier tool for the format."
          }
        },
        {
          "@type": "Question",
          "name": "How does The Wheelhaus pick a random Steam game?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Wheelhaus fetches a random batch of Steam apps through the CMAndersen Steam API, applies your filters, and optionally enriches each game with IGDB ratings. Games rated below 60/100 or with fewer than 5 IGDB reviewers are dropped so the wheel skips low-quality titles. The remaining games become segments on the wheel and one is chosen when the wheel stops spinning."
          }
        },
        {
          "@type": "Question",
          "name": "Does The Wheelhaus include every Steam game?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The underlying dataset covers every public Steam app thanks to the CMAndersen Steam API. Filters and optional IGDB curation narrow the pool to games that match your criteria."
          }
        },
        {
          "@type": "Question",
          "name": "Is The Wheelhaus free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The Wheelhaus is completely free and does not require an account. It is an independent project by Adrian Chrysanthou and is not affiliated with Valve or Steam."
          }
        },
        {
          "@type": "Question",
          "name": "How do I use my Steam library with The Wheelhaus?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Enter your 17-digit Steam ID (not your display name) into the username field. Your Steam profile and game library must be set to public in Steam Privacy Profile Settings, with Game Details set to Public."
          }
        }
      ]
    }
